# https://codeberg.org/Calamares/calamares/src/branch/calamares/src/modules/users/users.conf
# Finix-valid groups only: there is no networkmanager group on Finix
# (networking = dhcpcd + iwd); video is needed for GPU access under seatd.
defaultGroups:
    - users
    - wheel
    - video

setRootPassword: true
doReusePassword: false
doAutologin: false

# Recommended libpwquality settings from upstream
passwordRequirements:
    minLength: 8
    maxLength: 64
    libpwquality:
        - minlen=8
        - maxrepeat=3
        - maxsequence=3
        - usersubstr=4
        - badwords=linux

allowWeakPasswords: true
allowWeakPasswordsDefault: false

user:
  shell: /run/current-system/sw/bin/bash
  forbidden_names: [ root ]

# location stays None: the hostname is applied declaratively via
# networking.hostName in the generated configuration.nix (main.py reads the
# GlobalStorage "hostname" value this page sets). The template pre-fills the
# field so an untouched field yields "finix", never "nixos".
hostname:
  location: None
  writeHostsFile: false
  template: "finix"
  forbidden_names: [ localhost ]
