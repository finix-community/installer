# https://codeberg.org/Calamares/calamares/src/branch/calamares/src/modules/finished/finished.conf
restartNowMode: user-unchecked
# Calamares runs this through `/bin/sh -c` (finished/Config.cpp), so a
# fallback chain works. The live ISO is currently NixOS-based (systemd), so
# systemctl wins there, but keep fallbacks so the button also works on a
# finit-based live (no systemd: loginctl under elogind, plain `reboot` when
# running as root, passwordless sudo for the usual live user setup).
restartNowCommand: "systemctl -i reboot || loginctl reboot || reboot || sudo -n reboot"
notifyOnFinished: true
