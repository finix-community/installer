# system naming chooser: where the flake lives and what the rebuild
# command is called (globalstorage key "packagechooser_naming")
mode: required

method: legacy

labels:
    step: "System naming"

default: finix

items:
    - id: finix
      packages: [ finix ]
      name: "finix naming"
      description: "<html>The system configuration (flake) lives in <tt>/etc/finix</tt> and you rebuild the system with <tt>sudo finix-rebuild switch</tt>.<br/>
                    <br/>This is the finix default and what the finix documentation assumes.</html>"

    - id: nixos
      packages: [ nixos ]
      name: "NixOS naming"
      description: "<html>The system configuration (flake) lives in <tt>/etc/nixos</tt> and you rebuild the system with <tt>sudo nixos-rebuild switch</tt>, the classic NixOS layout.<br/>
                    <br/>Pick this if you want NixOS guides, tools and muscle memory to work unchanged. The installed system is still finix (finit PID 1, no systemd); only the paths and the command name differ.</html>"
