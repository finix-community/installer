---
mode: required
method: legacy

labels:
    step: "System naming"

default: finix

items:
    - id: finix
      packages: [ finix ]
      name: "finix naming"
      description: "<html>The system flake lives in <tt>/etc/finix</tt>; rebuild with <tt>sudo finix-rebuild switch</tt>.</html>"

    - id: nixos
      packages: [ nixos ]
      name: "NixOS naming"
      description: "<html>The system flake lives in <tt>/etc/nixos</tt>; rebuild with <tt>sudo nixos-rebuild switch</tt>. The installed system is still finix, only the paths and the command name differ.</html>"
