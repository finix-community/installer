# debugging chooser: whether stage-1 (initrd) opens a root rescue shell when
# boot fails, instead of "rescue shell is disabled" + reboot after 10s
# (globalstorage key "packagechooser_debug"; maps to finix's
# boot.initrd.emergencyAccess option in main.py)
mode: required

method: legacy

labels:
    step: "Debugging"

default: none

items:
    - id: none
      packages: [ none ]
      name: "Normal boot"
      description: "<html>If the system fails to boot (for example the root filesystem is not found), it prints the failure reason and reboots after 10 seconds.<br/>
                    <br/>This is the safe default: no unauthenticated shell is ever offered at boot.</html>"

    - id: rescue
      packages: [ rescue ]
      name: "Enable emergency access"
      description: "<html>If the system fails to boot, stage 1 opens a <b>root rescue shell</b> on the console so the problem can be diagnosed (<tt>initctl status</tt>, <tt>initctl cond dump</tt>, missing disks, mdevd issues...).<br/>
                    <br/><b>Note:</b> anyone with physical access to the machine can trigger this shell. Recommended while finix is young; remove <tt>boot.initrd.emergencyAccess</tt> from configuration.nix to turn it off later.</html>"
