---
mode: required
method: legacy

labels:
    step: "Debugging"

default: none

items:
    - id: none
      packages: [ none ]
      name: "Normal boot"
      description: "<html>If the system fails to boot, it prints the reason and reboots after 10 seconds. No shell is offered at boot.</html>"

    - id: rescue
      packages: [ rescue ]
      name: "Enable emergency access"
      description: "<html>If the system fails to boot, stage 1 opens a <b>root shell</b> on the console.<br/>
                    <br/>Anyone with physical access can use that shell. Remove <tt>boot.initrd.emergencyAccess</tt> from configuration.nix to turn it off.</html>"
