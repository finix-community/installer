efi:
    mountPoint: "/boot"
    recommendedSize: 1GiB
    minimumSize: 512MiB
    label: "EFI"

userSwapChoices:
    - none
    - small
    - suspend

luksGeneration: luks2

defaultFileSystemType: "ext4"

availableFileSystemTypes:
    - ext4
    - btrfs
    - xfs
    - f2fs

showNotEncryptedBootMessage: false

partitionLayout:
    - name: "root"
      filesystem: "unknown"
      noEncrypt: false
      mountPoint: "/"
      size: 100%
