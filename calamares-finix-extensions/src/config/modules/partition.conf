# https://codeberg.org/Calamares/calamares/src/branch/calamares/src/modules/partition/partition.conf
efi:
    mountPoint: "/boot"
    recommendedSize: 1GiB
    # limine copies every generation's kernel+initrd (~55 MiB each) onto the
    # ESP, so a tiny ESP fails mid-install with ENOSPC. Refuse anything that
    # cannot hold a few generations.
    minimumSize: 512MiB
    label: "EFI"

userSwapChoices:
    - none
    - small
    - suspend

luksGeneration: luks2

defaultFileSystemType: "ext4"

availableFileSystemTypes:
    - ext4
    - btrfs
    - xfs
    - f2fs

showNotEncryptedBootMessage: false

partitionLayout:
    - name: "root"
      filesystem: "unknown"
      noEncrypt: false
      mountPoint: "/"
      size: 100%
