# Desktop / compositor chooser for the Finix installer.
#
# INVARIANT: every id listed here must have a real Finix module (or a
# module vendored by this installer — plasma.nix / sessions.nix) and a
# matching entry in main.py's cfgsessions — the install emits exactly what is
# chosen.
#
# Multi-select: users can pick SEVERAL sessions; every pick is installed and
# shows up in the login greeter's session list.
mode: requiredmultiple

# FIXME: what's the correct way of doing this now?
method: legacy

labels:
    step: "Desktop"

default: labwc

items:
    - id: labwc
      packages: [ labwc ]
      name: Labwc
      description: "<html>Lightweight Wayland compositor in the Openbox tradition: simple, stable and fast. This is the default and best-tested session on Finix.<br/>
                    <br/><b>Tip:</b> you can select SEVERAL desktops on this page — click an entry to add it to the selection, click it again to remove it. Every selected desktop is installed and appears in the login screen.<br/>
                    <br/>Learn more at <a href=\"https://labwc.github.io/\">labwc.github.io</a></html>"

    - id: labwc-noctalia
      packages: [ labwc-noctalia ]
      name: "Labwc + Noctalia"
      description: "<html>Labwc with the Noctalia v5 desktop shell on top: bar, launcher, control center, notifications, lock screen and OSDs. Comes with XWayland and PipeWire audio working out of the box. Note: Noctalia is compiled from source during installation (adds roughly 15-30 minutes).<br/>
                    <br/>Learn more at <a href=\"https://noctalia.dev/\">noctalia.dev</a></html>"

    - id: lxqt
      packages: [ lxqt ]
      name: LXQt
      description: "<html>A complete lightweight desktop environment: panel, application menu, file manager (PCManFM-Qt) and settings tools. Runs as a Wayland session on top of labwc.<br/>
                    <br/>Learn more at <a href=\"https://lxqt-project.org/\">lxqt-project.org</a></html>"

    - id: plasma
      packages: [ plasma ]
      name: "KDE Plasma"
      description: "<html>The full-featured KDE Plasma 6 desktop (Wayland session). Comes with PipeWire audio, Wi-Fi via iwgtk/iwctl, Dolphin, Konsole, System Settings and other KDE applications preinstalled.<br/>
                    <br/><b>Note:</b> Plasma is not officially supported by Finix yet — this is an experimental but carefully assembled session.<br/>
                    <br/>Learn more at <a href=\"https://kde.org/plasma-desktop/\">kde.org</a></html>"

    - id: sway
      packages: [ sway ]
      name: Sway
      description: "<html>Tiling Wayland compositor, drop-in replacement for the i3 window manager. Keyboard-driven; configured via ~/.config/sway/config.<br/>
                    <br/>Learn more at <a href=\"https://swaywm.org/\">swaywm.org</a></html>"

    - id: niri
      packages: [ niri ]
      name: Niri
      description: "<html>Scrollable-tiling Wayland compositor: windows are arranged in an infinite horizontal strip. A modern, polished workflow.<br/>
                    <br/>Learn more at <a href=\"https://github.com/YaLTeR/niri\">github.com/YaLTeR/niri</a></html>"

    - id: niri-noctalia
      packages: [ niri-noctalia ]
      name: "Niri + Noctalia"
      description: "<html>Niri with the Noctalia v5 desktop shell on top: bar, launcher, control center, notifications and lock screen. Includes xwayland-satellite for X11 apps and PipeWire audio out of the box. Note: Noctalia is compiled from source during installation (adds roughly 15-30 minutes).<br/>
                    <br/>Learn more at <a href=\"https://noctalia.dev/\">noctalia.dev</a></html>"

    - id: vxwm
      packages: [ vxwm ]
      name: vxwm
      description: "<html>Versatile dwm-style tiling window manager for X11: tags, layouts and a built-in bar, with the classic compiled-in configuration. Launches from the login greeter via startx; ships with st, dmenu and PipeWire audio.<br/>
                    <br/>Learn more at <a href=\"https://codeberg.org/wh1tepearl/vxwm\">codeberg.org/wh1tepearl/vxwm</a></html>"

    - id: newm
      packages: [ newm ]
      name: newm
      description: "<html>Touchpad-centric Wayland compositor with smooth gesture-driven navigation (pywm based). Configured in Python (~/.config/newm/config.py).<br/>
                    <br/>Learn more at <a href=\"https://github.com/jbuchermn/newm\">github.com/jbuchermn/newm</a></html>"

    - id: mango
      packages: [ mango ]
      name: Mango
      description: "<html>MangoWC: a streamlined dwl-based tiling Wayland compositor with animations and scratchpads. Light and fast.<br/>
                    <br/>Learn more at <a href=\"https://github.com/DreamMaoMao/mangowc\">github.com/DreamMaoMao/mangowc</a></html>"

    - id: mango-noctalia
      packages: [ mango-noctalia ]
      name: "Mango + Noctalia"
      description: "<html>MangoWC with the Noctalia v5 desktop shell on top: bar, launcher, control center, notifications and lock screen. XWayland and PipeWire audio work out of the box. Note: Noctalia is compiled from source during installation (adds roughly 15-30 minutes).<br/>
                    <br/>Learn more at <a href=\"https://noctalia.dev/\">noctalia.dev</a></html>"

    - id: minimal
      packages: [ minimal ]
      name: "Minimal (no desktop)"
      description: "<html>Base Finix system only: no window manager, no desktop environment, no graphical login. Boots to a console (tty) login — build your own setup from there with <tt>sudo finix-rebuild switch</tt>.<br/>
                    <br/>If you select Minimal together with other desktops, the desktops win and a graphical login is installed.</html>"

    - id: nvwm
      packages: [ nvwm ]
      name: NVWM
      description: "<html>Vim-inspired tiling window manager for X11 with modal controls (INSERT/NORMAL/COMMAND), workspaces and a built-in bar. Launches from the login greeter via startx; ships with alacritty, rofi and PipeWire audio.<br/>
                    <br/>Learn more at <a href=\"https://github.com/Vifuddyxg/nvwm\">github.com/Vifuddyxg/nvwm</a></html>"
