---
mode: requiredmultiple
method: legacy

labels:
    step: "Desktop"

default: labwc

items:
    - id: labwc
      packages: [ labwc ]
      name: Labwc
      description: "<html>Lightweight stacking Wayland compositor in the Openbox tradition. The default session on finix.<br/>
                    <br/>You can pick several desktops on this page: click an entry to add it, click again to remove it. Each one gets an entry in the login screen.<br/>
                    <br/><a href=\"https://labwc.github.io/\">labwc.github.io</a></html>"

    - id: labwc-noctalia
      packages: [ labwc-noctalia ]
      name: "Labwc + Noctalia"
      description: "<html>Labwc with the Noctalia desktop shell: bar, launcher, control center, notifications, lock screen and OSDs.<br/>
                    <br/><a href=\"https://noctalia.dev/\">noctalia.dev</a></html>"

    - id: gluewc
      packages: [ gluewc ]
      name: gluewc
      description: "<html>Animated Wayland compositor with automatic BSP tiling, scrolling and drift layouts, nine workspaces per monitor and a GNOME-style overview. Ships with alacritty and rofi for its default keybindings.<br/>
                    <br/><a href=\"https://github.com/vladbiber/gluewc\">github.com/vladbiber/gluewc</a></html>"

    - id: gluewc-glueqs
      packages: [ gluewc-glueqs ]
      name: "gluewc + glueqs"
      description: "<html>gluewc with glueqs, the dot-matrix Quickshell bar written for it: launcher, workspaces, tray, media, volume, battery, notifications, wallpaper picker and a session menu.<br/>
                    <br/><a href=\"https://github.com/vladbiber/glueqs\">github.com/vladbiber/glueqs</a></html>"

    - id: lxqt
      packages: [ lxqt ]
      name: LXQt
      description: "<html>Lightweight desktop environment: panel, application menu, PCManFM-Qt file manager and settings tools. Runs as a Wayland session on labwc.<br/>
                    <br/><a href=\"https://lxqt-project.org/\">lxqt-project.org</a></html>"

    - id: plasma
      packages: [ plasma ]
      name: "KDE Plasma"
      description: "<html>KDE Plasma 6 (Wayland) with Dolphin, Konsole, System Settings and the usual KDE applications. Wi-Fi through iwgtk/iwctl.<br/>
                    <br/>Plasma is not officially supported by finix yet.<br/>
                    <br/><a href=\"https://kde.org/plasma-desktop/\">kde.org</a></html>"

    - id: sway
      packages: [ sway ]
      name: Sway
      description: "<html>Tiling Wayland compositor, drop-in replacement for i3. Configured in ~/.config/sway/config.<br/>
                    <br/><a href=\"https://swaywm.org/\">swaywm.org</a></html>"

    - id: sway-noctalia
      packages: [ sway-noctalia ]
      name: "Sway + Noctalia"
      description: "<html>Sway with the Noctalia desktop shell: bar, launcher, control center, notifications and lock screen.<br/>
                    <br/><a href=\"https://noctalia.dev/\">noctalia.dev</a></html>"

    - id: niri
      packages: [ niri ]
      name: Niri
      description: "<html>Scrollable-tiling Wayland compositor: windows sit on an infinite horizontal strip.<br/>
                    <br/><a href=\"https://github.com/YaLTeR/niri\">github.com/YaLTeR/niri</a></html>"

    - id: niri-noctalia
      packages: [ niri-noctalia ]
      name: "Niri + Noctalia"
      description: "<html>Niri with the Noctalia desktop shell, plus xwayland-satellite for X11 applications.<br/>
                    <br/><a href=\"https://noctalia.dev/\">noctalia.dev</a></html>"

    - id: vxwm
      packages: [ vxwm ]
      name: vxwm
      description: "<html>dwm-style tiling window manager for X11: tags, layouts and a built-in bar, configured at compile time. Ships with st and dmenu.<br/>
                    <br/><a href=\"https://codeberg.org/wh1tepearl/vxwm\">codeberg.org/wh1tepearl/vxwm</a></html>"

    - id: newm
      packages: [ newm ]
      name: newm
      description: "<html>Touchpad-centric Wayland compositor (pywm), configured in Python (~/.config/newm/config.py).<br/>
                    <br/><a href=\"https://github.com/jbuchermn/newm\">github.com/jbuchermn/newm</a></html>"

    - id: mango
      packages: [ mango ]
      name: Mango
      description: "<html>MangoWC: dwl-based tiling Wayland compositor with animations and scratchpads.<br/>
                    <br/><a href=\"https://github.com/DreamMaoMao/mangowc\">github.com/DreamMaoMao/mangowc</a></html>"

    - id: mango-noctalia
      packages: [ mango-noctalia ]
      name: "Mango + Noctalia"
      description: "<html>MangoWC with the Noctalia desktop shell: bar, launcher, control center, notifications and lock screen.<br/>
                    <br/><a href=\"https://noctalia.dev/\">noctalia.dev</a></html>"

    - id: minimal
      packages: [ minimal ]
      name: "Minimal (no desktop)"
      description: "<html>Base system only: no window manager, no graphical login. Boots to a console login; add what you want with <tt>sudo finix-rebuild switch</tt>.<br/>
                    <br/>If Minimal is selected together with other desktops, the desktops win.</html>"

    - id: nvwm
      packages: [ nvwm ]
      name: NVWM
      description: "<html>Vim-inspired tiling window manager for X11 with modal controls, workspaces and a built-in bar. Ships with alacritty and rofi.<br/>
                    <br/><a href=\"https://github.com/Vifuddyxg/nvwm\">github.com/Vifuddyxg/nvwm</a></html>"
